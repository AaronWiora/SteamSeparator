<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamSeparator</title>
  <link rel="stylesheet" href="/static/styles.css?v=3.7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-icon" title="SteamSeparator">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.029 4.524 4.524s-2.03 4.524-4.524 4.524h-.105l-4.076 2.911c0 .052.005.105.005.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.155-3.331-2.677L.437 14.77C1.862 20.04 6.643 24 11.979 24c6.627 0 12-5.373 12-12s-5.373-12-12-12zM8.366 17.069l-2.022-.835c.341-.593.978-1.002 1.706-1.002.321 0 .625.078.896.216l-.58 1.621zm7.573-5.399c-1.528 0-2.766-1.238-2.766-2.766 0-1.527 1.238-2.765 2.766-2.765s2.766 1.238 2.766 2.765c0 1.528-1.238 2.766-2.766 2.766zm-5.044 5.864c0-.987.804-1.791 1.791-1.791.986 0 1.79.804 1.79 1.791 0 .986-.804 1.79-1.79 1.79-.987 0-1.791-.804-1.791-1.79z"/>
          </svg>
        </div>
        <div>
          <h1 id="i18n-title">SteamSeparator</h1>
        </div>
      </div>
      <div class="header-right">
        <!-- Language Switcher (Segmented Control with Globe) -->
        <div class="lang-switch-wrapper" title="App Language">
          <span class="lang-globe-icon" aria-hidden="true">🌐</span>
          <div class="lang-switch">
            <button id="btn-lang-en" class="lang-btn active">EN</button>
            <button id="btn-lang-de" class="lang-btn">DE</button>
          </div>
        </div>

        <div id="steam-status-badge" class="status-badge checking">
          <span class="status-dot"></span>
          <span id="steam-status-text">...</span>
        </div>
        <div class="account-selector-box">
          <label for="account-select" id="i18n-lbl-account">Account:</label>
          <select id="account-select"></select>
        </div>
      </div>
    </header>

    <!-- Scan Progress Bar -->
    <div id="scan-progress-card" class="progress-card hidden">
      <div class="progress-header">
        <span id="scan-message">Scanne...</span>
        <span id="scan-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="scan-progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="main-layout">
      <!-- Settings Panel (Lean & Clean) -->
      <aside class="settings-panel">
        <div class="panel-card">
          <div class="panel-card-header">
            <h2 id="i18n-tuning-title">Feinjustierung</h2>
          </div>

          <!-- 3-Button Level Selector -->
          <div class="setting-group">
            <div class="setting-label-row">
              <label class="setting-label" id="i18n-confidence-label">Review-Filter</label>
              <div class="popover-wrapper">
                <button type="button" class="info-tooltip-icon" id="btn-confidence-info" aria-label="Info zum Review-Filter">ⓘ</button>
                <div class="popover-box" id="confidence-popover" role="tooltip">
                  <div class="popover-arrow"></div>
                  <div class="popover-content" id="i18n-confidence-popover-text">
                    Verhindert, dass Spiele mit nur wenigen Reviews fälschlicherweise in Top-Kategorien landen. Anhand der Gesamtstimmen wird die Wertung statistisch abgesichert.
                  </div>
                </div>
              </div>
            </div>
            <div class="level-btn-group">
              <button class="level-btn" data-c="150" id="btn-level-low">Niedrig</button>
              <button class="level-btn active" data-c="350" id="btn-level-med">Mittel</button>
              <button class="level-btn" data-c="700" id="btn-level-high">Hoch</button>
            </div>
          </div>

          <!-- Collection Selection -->
          <div class="setting-group">
            <label class="setting-label" id="i18n-collections-label">Collections in Steam erstellen:</label>
            <div id="tiers-checkbox-list" class="checkbox-list">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Actions -->
          <div class="action-buttons">
            <button id="btn-scan" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
              <span id="i18n-btn-scan">Bewertungen scannen</span>
            </button>
            <button id="btn-save" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              <span id="i18n-btn-save">In Steam anwenden</span>
            </button>
          </div>
          <div class="scan-options">
            <label class="toggle-switch-row" id="toggle-force-refresh-label" title="Ignoriert den lokalen Cache und fragt alle Titel frisch bei Steam ab">
              <span class="toggle-switch-label" id="i18n-lbl-force-refresh">Voll-Scan erzwingen</span>
              <span class="toggle-switch">
                <input type="checkbox" id="check-force-refresh">
                <span class="toggle-slider"></span>
              </span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="content-panel">
        <!-- Stats Summary (Dynamic) -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- Table Toolbar -->
        <div class="table-toolbar">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Spiel suchen...">
          </div>
          <div class="filter-pills">
            <button class="pill active" data-filter="assigned" id="pill-assigned">Zugeordnet</button>
            <button class="pill" data-filter="excluded" id="pill-excluded">Ausgeschlossen</button>
          </div>
        </div>

        <!-- Games Table -->
        <div class="table-container">
          <table class="games-table">
            <thead>
              <tr>
                <th style="width: 125px;" id="th-cover">Cover</th>
                <th id="th-game">Spiel</th>
                <th style="text-align: right;" id="th-raw" title="Gewichtet die Review-Anzahl: Verhindert Top-Einstufungen bei geringer Stimmenanzahl.">Positiv %</th>
                <th style="text-align: right;" id="th-score" title="Gewichtet die Review-Anzahl: Verhindert Top-Einstufungen bei geringer Stimmenanzahl.">Gewichteter Score</th>
                <th id="th-status">Steam-Collection</th>
              </tr>
            </thead>
            <tbody id="games-table-body">
              <tr>
                <td colspan="5" class="table-loading">Lade Bibliothek...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js?v=3.7"></script>
</body>
</html>
